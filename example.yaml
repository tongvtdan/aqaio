# AQAIO - Air Quality All-In-One
# Example ESPHome configuration for XIAO ESP32-C6 + SEN66 + e-paper display
# Requires ESPHome 2025.12 or newer for the seeed_xiao_esp32c6 board definition.
#
# Usage:
#   1. Copy this file to your ESPHome config directory
#   2. Update the external_components URL to your repo
#   3. Flash to your XIAO ESP32-C6

esphome:
  name: aqaio
  friendly_name: "AQAIO Air Quality"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/w4ilun/aqaio
    components: [aqaio]

time:
  - platform: sntp
    id: ntp_time
    timezone: "America/New_York" # Your timezone
    update_interval: 15min
    servers:
      - "pool.ntp.org"

aqaio:
  update_interval: 60s
  time_id: ntp_time
  # I2C pins (SEN66). Keep D4/D5 here because D10 is e-paper MOSI.
  i2c_sda: 22 # XIAO D4
  i2c_scl: 23 # XIAO D5
  # SPI pins (e-paper GDEH0154D67)
  epd_mosi: 18 # XIAO D10 / MOSI
  epd_sclk: 19 # XIAO D8 / SCK
  epd_cs: 21   # XIAO D3
  epd_dc: 2    # XIAO D2
  epd_rst: 1   # XIAO D1
  epd_busy: 0  # XIAO D0
  # Display settings
  display_rotation: 0   # 0=vertical_up, 1=horizontal_left, 2=vertical_down, 3=horizontal_right
  use_fahrenheit: false
  # Air quality thresholds for "good" face indicator
  aq_co2_max: 1000
  aq_voc_max: 150
  aq_nox_max: 1
  aq_pm_max: 12

sensor:
  - platform: aqaio
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    co2:
      name: "CO2"
    voc:
      name: "VOC Index"
    nox:
      name: "NOx Index"
    pm_1_0:
      name: "PM 1.0"
    pm_2_5:
      name: "PM 2.5"
    pm_4_0:
      name: "PM 4.0"
    pm_10_0:
      name: "PM 10"
